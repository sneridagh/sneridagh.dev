---
version: '3.8'
services:

  matomo:
    # Matomo 5.14.2 on PHP 8.4.27 (php:8.4-apache base).
    # The official image is rebuilt under the same tag when PHP or Debian get
    # security fixes, so redeploying pulls them in.
    image: matomo:5.14.2-apache
    depends_on:
      - db
    networks:
      - nw-stats-prod
      - public
    volumes:
      # Only persist what Matomo writes at runtime. The application code must
      # come from the image: the entrypoint only copies it into /var/www/html
      # when that folder is empty, so a persisted webroot never gets upgraded.
      - vol-matomo-config:/var/www/html/config
      - vol-matomo-misc-user:/var/www/html/misc/user
    environment:
      MATOMO_DATABASE_HOST: "db"
      MATOMO_DATABASE_ADAPTER: "mysql"
      MATOMO_DATABASE_TABLES_PREFIX: "${MATOMO_DATABASE_TABLES_PREFIX:-matomo_}"
      MATOMO_DATABASE_USERNAME: "${MYSQL_USER:-plone}"
      MATOMO_DATABASE_PASSWORD: "${MYSQL_PASSWORD:-plone}"
      MATOMO_DATABASE_DBNAME: "${MYSQL_DATABASE:-matomo}"
      DEBUG: "1"

    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        order: start-first
      labels:
        - traefik.enable=true
        - traefik.docker.network=public
        - traefik.constraint-label=public
        # Service
        - traefik.http.services.svc-stats-matomo-prod.loadbalancer.server.port=80
        # Router: Main
        - traefik.http.routers.rt-stats-prod.rule=Host(`analytics.sneridagh.dev`)
        - traefik.http.routers.rt-stats-prod.entrypoints=https
        - traefik.http.routers.rt-stats-prod.tls=true
        - traefik.http.routers.rt-stats-prod.tls.certresolver=le
        - traefik.http.routers.rt-stats-prod.service=svc-stats-matomo-prod
        - traefik.http.routers.rt-stats-prod.middlewares=gzip

  db:
    image: mariadb:10.3
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      - nw-stats-prod
    volumes:
      - vol-matomo-db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-plone}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-matomo}"
      MYSQL_USER: "${MYSQL_USER:-plone}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-plone}"

volumes:
  vol-matomo-db:
    driver_opts:
      type: none
      device: /srv/matomo/data
      o: bind
  vol-matomo-config:
    driver_opts:
      type: none
      device: /srv/matomo/etc/config
      o: bind
  vol-matomo-misc-user:
    driver_opts:
      type: none
      device: /srv/matomo/etc/misc/user
      o: bind

networks:
  public:
    external: true
    name: public

  nw-stats-prod:
    internal: true
    driver: overlay
